<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src data: blob:; connect-src https://api.github.com;">
<title>ตัวแก้โจทย์วงกต</title>
<style>
:root{--bg:#f5f6fa;--card:#fff;--ink:#1d2433;--mut:#667085;--line:#d9dde8;--pri:#2f5bea;--pri-ink:#fff;--ok:#157f3b;--warn:#b45309;--bad:#c0262d}
@media (prefers-color-scheme:dark){:root{--bg:#12151c;--card:#1b2030;--ink:#e8ebf4;--mut:#9aa3b8;--line:#2e3650;--pri:#6c8cff;--pri-ink:#0d1020;--ok:#4ade80;--warn:#fbbf24;--bad:#ff7a80}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 system-ui,"Noto Sans Thai",Tahoma,sans-serif}
header{display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:12px 16px;background:var(--card);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:2}
header h1{font-size:18px;margin:0 auto 0 0}
main{display:grid;grid-template-columns:minmax(240px,320px) 1fr;gap:16px;padding:16px;max-width:1100px;margin:0 auto}
@media (max-width:760px){main{grid-template-columns:1fr}}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px}
button,input,textarea,select{font:inherit;color:inherit}
button{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:6px 12px;cursor:pointer}
button.pri{background:var(--pri);color:var(--pri-ink);border-color:var(--pri)}
button.bad{color:var(--bad)}
button:disabled{opacity:.5;cursor:default}
input[type=text],input[type=number],input[type=password],textarea{width:100%;background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:6px 10px}
textarea{min-height:70px;resize:vertical}
label{display:block;font-size:14px;color:var(--mut);margin:10px 0 4px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.grow{flex:1;min-width:120px}
.set{font-weight:600;margin:12px 0 4px;color:var(--mut)}
.item{display:block;width:100%;text-align:left;margin:2px 0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.item.sel{border-color:var(--pri)}
.choice{display:grid;grid-template-columns:auto 1fr;gap:6px 10px;align-items:start;padding:8px 0;border-top:1px solid var(--line)}
.slot{display:flex;gap:6px;align-items:center;flex-wrap:wrap;font-size:14px;color:var(--mut)}
.slot img{max-height:96px;border-radius:6px;border:1px solid var(--line)}
#status{padding:8px 16px;font-size:14px;min-height:36px}
.ok{color:var(--ok)}.warn{color:var(--warn)}.err{color:var(--bad)}
.hide{display:none!important}
.note{font-size:13px;color:var(--mut)}
</style>
</head>
<body>
<header>
  <h1>ตัวแก้โจทย์วงกต</h1>
  <button id="bSettings">ตั้งค่า</button>
  <button id="bReload">โหลดใหม่</button>
  <button id="bNew">+ เพิ่มโจทย์</button>
  <button id="bSave" class="pri">บันทึกขึ้น GitHub</button>
</header>
<div id="status"></div>
<main>
  <section>
    <div class="card hide" id="settings">
      <label>ชื่อบัญชี GitHub (เจ้าของรีโป)</label><input type="text" id="cOwner" autocomplete="off">
      <label>ชื่อรีโปเก็บโจทย์</label><input type="text" id="cRepo" autocomplete="off">
      <label>Token (Contents: Read and write)</label><input type="password" id="cToken" autocomplete="off">
      <p class="note">Token เก็บในเบราว์เซอร์เครื่องนี้เท่านั้น หน้านี้ส่งข้อมูลไปที่ api.github.com เท่านั้น อย่าใช้บนคอมพิวเตอร์สาธารณะ</p>
      <button id="bCfg" class="pri">บันทึกการตั้งค่า</button>
    </div>
    <div class="card">
      <input type="text" id="filter" placeholder="ค้นหาโจทย์…">
      <div id="list"></div>
      <hr style="border:0;border-top:1px solid var(--line);margin:12px 0">
      <div class="row">
        <button id="bImport">นำเข้า CSV/JSON</button>
        <label class="row" style="margin:0"><input type="checkbox" id="replaceAll"> แทนที่ทั้งหมด</label>
      </div>
      <div class="row" style="margin-top:8px">
        <button id="bExpJson">ส่งออก JSON</button>
        <button id="bExpCsv">ส่งออก CSV</button>
      </div>
      <input type="file" id="fImport" accept=".csv,.json,application/json,text/csv" class="hide">
      <p class="note">CSV คอลัมน์: ชุด, ข้อ, โจทย์, รูปโจทย์, ตัวเลือก1–5, ข้อที่ถูก (ช่องรูปใส่ images/… หรือ rbxassetid://…)</p>
    </div>
  </section>
  <section class="card" id="form"><p class="note">เลือกโจทย์จากรายการ หรือกด “+ เพิ่มโจทย์”</p></section>
</main>
<script>
"use strict";
const $ = (s) => document.querySelector(s);
function h(tag, props = {}, ...kids) {
  const e = document.createElement(tag);
  for (const [k, v] of Object.entries(props)) {
    if (k === "class") e.className = v;
    else if (k.startsWith("on")) e.addEventListener(k.slice(2), v);
    else if (k !== "list" && k in e) e[k] = v; // list เป็น property อ่านอย่างเดียว ใช้ setAttribute
    else e.setAttribute(k, v);
  }
  for (const c of kids.flat()) if (c != null && c !== false) e.append(c.nodeType ? c : document.createTextNode(String(c)));
  return e;
}

// ---------- ค่าตั้ง / สถานะ ----------
let cfg = { owner: "", repo: "maze-quiz-data", token: "" };
try { Object.assign(cfg, JSON.parse(localStorage.getItem("mazeEditorCfg") || "{}")); } catch {}
let data = [];            // โจทย์ทั้งหมด
let sha = null;           // sha ของ questions.json
let assets = {};          // images/x.png -> assetId
const pending = {};       // images/x.png -> base64 (ยังไม่ commit)
const imgCache = {};      // images/x.png -> data URL ที่ดึงจาก repo
let dirty = false;
let editing = null;       // null | -1 (ใหม่) | index
let form = null;

const MAX_TEXT = 300;
const key = (q) => `${q.set}-${q.num}`;
const isImg = (v) => typeof v === "string" && /^(images\/[\w.-]+|rbxassetid:\/\/\d+)$/.test(v);

function status(msg, cls = "") { const s = $("#status"); s.textContent = msg; s.className = cls; }
function markDirty() { dirty = true; renderList(); }
window.addEventListener("beforeunload", (e) => { if (dirty) { e.preventDefault(); e.returnValue = ""; } });

// ---------- base64 / GitHub ----------
const enc = (s) => { const b = new TextEncoder().encode(s); let t = ""; for (let i = 0; i < b.length; i += 8192) t += String.fromCharCode(...b.subarray(i, i + 8192)); return btoa(t); };
const dec = (b64) => new TextDecoder().decode(Uint8Array.from(atob(b64.replace(/\s/g, "")), (c) => c.charCodeAt(0)));

async function gh(method, path, body) {
  if (!cfg.owner || !cfg.repo || !cfg.token) throw new Error("ยังไม่ได้ตั้งค่า (กดปุ่มตั้งค่า)");
  const r = await fetch(`https://api.github.com/repos/${encodeURIComponent(cfg.owner)}/${encodeURIComponent(cfg.repo)}/contents/${path}`, {
    method,
    headers: { Authorization: `Bearer ${cfg.token}`, Accept: "application/vnd.github+json", "X-GitHub-Api-Version": "2022-11-28" },
    body: body ? JSON.stringify(body) : undefined,
    cache: "no-store",
  });
  const j = await r.json().catch(() => ({}));
  if (!r.ok) { const e = new Error(j.message || `HTTP ${r.status}`); e.status = r.status; throw e; }
  return j;
}

async function load() {
  status("กำลังโหลด…");
  try {
    try { const q = await gh("GET", "questions.json"); sha = q.sha; data = JSON.parse(dec(q.content)).questions || []; }
    catch (e) { if (e.status === 404) { data = []; sha = null; } else throw e; }
    try { assets = JSON.parse(dec((await gh("GET", "assets.json")).content)); } catch { assets = {}; }
    dirty = false; editing = null; form = null;
    renderList(); renderForm();
    status(`โหลดแล้ว ${data.length} ข้อ`, "ok");
  } catch (e) { status("โหลดไม่สำเร็จ: " + e.message, "err"); }
}

async function save() {
  const bad = data.map((q) => [key(q), validate(q)]).find(([, m]) => m);
  if (bad) return status(`บันทึกไม่ได้ ข้อ ${bad[0]}: ${bad[1]}`, "err");
  const btn = $("#bSave"); btn.disabled = true;
  try {
    status("กำลังบันทึก…");
    for (const [path, b64] of Object.entries(pending)) {
      await gh("PUT", path, { message: "add image", content: b64 });
      delete pending[path];
    }
    data.sort((a, b) => String(a.set).localeCompare(String(b.set), "th", { numeric: true }) || a.num - b.num);
    const body = { message: "update questions", content: enc(JSON.stringify({ questions: data }, null, 2) + "\n") };
    if (sha) body.sha = sha;
    sha = (await gh("PUT", "questions.json", body)).content.sha;
    dirty = false; renderList();
    status("บันทึกแล้ว ถ้ามีรูปใหม่ รอ 1–2 นาทีให้ระบบอัปโหลดรูปไป Roblox", "ok");
  } catch (e) {
    status(e.status === 409 || e.status === 422 ? "ไฟล์ถูกแก้จากที่อื่น กด “โหลดใหม่” (การแก้ที่ยังไม่บันทึกจะหาย)" : "บันทึกไม่สำเร็จ: " + e.message, "err");
  } finally { btn.disabled = false; }
}

// ---------- ตรวจข้อมูล ----------
function validate(q) {
  if (!String(q.set ?? "").trim() || q.num === "" || q.num == null) return "ต้องมีชุดและข้อ";
  if (String(q.set).includes("-")) return "ชื่อชุดห้ามมีเครื่องหมาย -";
  if (!Number.isInteger(Number(q.num)) || Number(q.num) < 1) return "ข้อต้องเป็นจำนวนเต็ม ≥ 1";
  if (!q.text && !q.image) return "ต้องมีโจทย์ (ข้อความหรือรูป)";
  if ((q.text || "").length > MAX_TEXT) return `โจทย์ยาวเกิน ${MAX_TEXT} ตัวอักษร`;
  if (q.image && !isImg(q.image)) return "รูปโจทย์ไม่ถูกต้อง";
  if (!Array.isArray(q.choices) || q.choices.length !== 5) return "ต้องมี 5 ตัวเลือก";
  for (let i = 0; i < 5; i++) {
    const c = q.choices[i];
    if (!c.text && !c.image) return `ตัวเลือก ${i + 1} ว่าง`;
    if ((c.text || "").length > MAX_TEXT) return `ตัวเลือก ${i + 1} ยาวเกิน ${MAX_TEXT}`;
    if (c.image && !isImg(c.image)) return `รูปตัวเลือก ${i + 1} ไม่ถูกต้อง`;
  }
  if (!Number.isInteger(q.answer) || q.answer < 1 || q.answer > 5) return "ต้องเลือกข้อที่ถูก";
  return null;
}

function imgState(path) {
  if (!path || path.startsWith("rbxassetid://")) return "";
  if (path in pending) return "ยังไม่บันทึก";
  return assets[path] ? "พร้อมใช้" : "รออัปโหลด";
}
function questionImages(q) { return [q.image, ...q.choices.map((c) => c.image)].filter(Boolean); }

// ---------- รายการ ----------
function renderList() {
  const box = $("#list"); box.replaceChildren();
  const f = $("#filter").value.trim().toLowerCase();
  const groups = new Map();
  data.forEach((q, i) => {
    if (f && !(key(q) + " " + (q.text || "")).toLowerCase().includes(f)) return;
    if (!groups.has(q.set)) groups.set(q.set, []);
    groups.get(q.set).push(i);
  });
  [...groups.keys()].sort((a, b) => String(a).localeCompare(String(b), "th", { numeric: true })).forEach((s) => {
    box.append(h("div", { class: "set" }, `ชุด ${s}`));
    groups.get(s).sort((a, b) => data[a].num - data[b].num).forEach((i) => {
      const q = data[i];
      const waiting = questionImages(q).some((p) => ["รออัปโหลด", "ยังไม่บันทึก"].includes(imgState(p)));
      box.append(h("button", { class: "item" + (editing === i ? " sel" : ""), onclick: () => edit(i) },
        `${q.num}. ${(q.text || "(โจทย์เป็นรูป)").slice(0, 40)}`, waiting ? " ⏳" : ""));
    });
  });
  if (!box.firstChild) box.append(h("p", { class: "note" }, "ยังไม่มีโจทย์"));
  $("#bSave").textContent = dirty ? "บันทึกขึ้น GitHub *" : "บันทึกขึ้น GitHub";
}

// ---------- ฟอร์ม ----------
const blankQ = (set = "") => ({ set, num: 1 + Math.max(0, ...data.filter((q) => q.set === set).map((q) => Number(q.num))), text: "", image: null,
  choices: Array.from({ length: 5 }, () => ({ text: "", image: null })), answer: 0 });

function edit(i) { editing = i; form = structuredClone(data[i]); form.choices.forEach((c) => { c.text ??= ""; c.image ??= null; }); form.text ??= ""; renderForm(); renderList(); }
function add() { editing = -1; form = blankQ(data.length ? data[data.length - 1].set : "A"); renderForm(); renderList(); }

function fileToPng(file, max = 1024) {
  return new Promise((res, rej) => {
    const url = URL.createObjectURL(file), im = new Image();
    im.onload = () => {
      const s = Math.min(1, max / Math.max(im.width, im.height)), c = document.createElement("canvas");
      c.width = Math.round(im.width * s); c.height = Math.round(im.height * s);
      c.getContext("2d").drawImage(im, 0, 0, c.width, c.height);
      URL.revokeObjectURL(url); res({ b64: c.toDataURL("image/png").split(",")[1], w: c.width, h: c.height });
    };
    im.onerror = () => rej(new Error("เปิดไฟล์รูปไม่ได้"));
    im.src = url;
  });
}
const rand = () => [...crypto.getRandomValues(new Uint8Array(8))].map((b) => b.toString(16).padStart(2, "0")).join("");

function slot(get, set) {
  const wrap = h("div", { class: "slot" });
  const draw = () => {
    wrap.replaceChildren();
    const v = get();
    if (v && v in pending) wrap.append(h("img", { src: "data:image/png;base64," + pending[v], alt: "ตัวอย่างรูป" }));
    else if (v && v.startsWith("images/")) {
      const im = h("img", { alt: "ตัวอย่างรูป" });
      if (imgCache[v]) im.src = imgCache[v];
      else gh("GET", v).then((j) => { im.src = imgCache[v] = "data:image/png;base64," + j.content.replace(/\s/g, ""); })
        .catch(() => im.replaceWith(h("span", {}, "โหลดตัวอย่างไม่ได้")));
      wrap.append(im);
    }
    wrap.append(h("span", {}, v ? `รูป: ${v.startsWith("rbxassetid://") ? v : v.slice(7)} ${imgState(v)}` : "ไม่มีรูป"));
    const file = h("input", { type: "file", accept: "image/*", class: "hide", onchange: async () => {
      if (!file.files[0]) return;
      try { const r = await fileToPng(file.files[0]), path = `images/${rand()}_${r.w}x${r.h}.png`; pending[path] = r.b64; set(path); draw(); }
      catch (e) { status(e.message, "err"); }
    } });
    wrap.append(file, h("button", { type: "button", onclick: () => file.click() }, v ? "เปลี่ยนรูป" : "เลือกรูป"));
    if (v) wrap.append(h("button", { type: "button", class: "bad", onclick: () => { set(null); draw(); } }, "ลบรูป"));
  };
  draw(); return wrap;
}

function renderForm() {
  const box = $("#form"); box.replaceChildren();
  if (!form) return box.append(h("p", { class: "note" }, "เลือกโจทย์จากรายการ หรือกด “+ เพิ่มโจทย์”"));
  const sets = [...new Set(data.map((q) => q.set))];
  box.append(
    h("div", { class: "row" },
      h("div", { class: "grow" }, h("label", {}, "ชุด (1 ชุด = 1 วงกต)"),
        h("input", { type: "text", list: "sets", value: form.set, oninput: (e) => { form.set = e.target.value.trim(); } }),
        h("datalist", { id: "sets" }, sets.map((s) => h("option", { value: s })))),
      h("div", { style: "width:110px" }, h("label", {}, "ข้อ"),
        h("input", { type: "number", min: 1, value: form.num, oninput: (e) => { form.num = e.target.value === "" ? "" : Number(e.target.value); } }))),
    h("label", {}, `โจทย์ (ข้อความ ≤ ${MAX_TEXT} ตัวอักษร)`),
    h("textarea", { maxLength: MAX_TEXT, value: form.text, oninput: (e) => { form.text = e.target.value; } }),
    h("label", {}, "รูปโจทย์ (ถ้ามี)"),
    slot(() => form.image, (v) => { form.image = v; }),
    h("label", {}, "ตัวเลือก 5 ข้อ (ติ๊กวงกลมข้อที่ถูก) — แต่ละข้อใส่ข้อความ รูป หรือทั้งสองอย่างก็ได้"),
    ...form.choices.map((c, i) => h("div", { class: "choice" },
      h("input", { type: "radio", name: "ans", checked: form.answer === i + 1, onchange: () => { form.answer = i + 1; }, title: `ข้อ ${i + 1} ถูก` }),
      h("div", {},
        h("input", { type: "text", maxLength: MAX_TEXT, placeholder: `ตัวเลือก ${i + 1}`, value: c.text, oninput: (e) => { c.text = e.target.value; } }),
        slot(() => c.image, (v) => { c.image = v; })))),
    h("div", { class: "row", style: "margin-top:12px" },
      h("button", { class: "pri", onclick: apply }, "ใช้โจทย์นี้"),
      editing >= 0 ? h("button", { class: "bad", onclick: remove }, "ลบโจทย์") : null,
      h("button", { onclick: () => { editing = null; form = null; renderForm(); renderList(); } }, "ปิด")),
    h("p", { class: "note" }, "“ใช้โจทย์นี้” แก้ในหน้านี้ก่อน ต้องกด “บันทึกขึ้น GitHub” ด้านบนเพื่อส่งขึ้นรีโป"));
}

function clean(q) {
  const out = { set: String(q.set).trim(), num: Number(q.num), text: q.text || "", image: q.image || null,
    choices: q.choices.map((c) => { const o = {}; if (c.text) o.text = c.text; if (c.image) o.image = c.image; return o; }), answer: q.answer };
  return out;
}
function apply() {
  const q = clean(form), m = validate(q);
  if (m) return status(m, "err");
  const dup = data.findIndex((x, i) => key(x) === key(q) && i !== editing);
  if (dup >= 0) return status(`มีข้อ ${key(q)} อยู่แล้ว เปลี่ยนเลขข้อ`, "err");
  if (editing >= 0) data[editing] = q; else { data.push(q); editing = data.length - 1; }
  markDirty(); status("แก้ในหน้านี้แล้ว อย่าลืมกด “บันทึกขึ้น GitHub”", "warn");
}
function remove() {
  if (!confirm(`ลบข้อ ${key(data[editing])} ?`)) return;
  data.splice(editing, 1); editing = null; form = null; markDirty(); renderForm();
}

// ---------- CSV / JSON ----------
function parseCsv(text) {
  const rows = []; let row = [], cur = "", q = false;
  text = text.replace(/^﻿/, "");
  for (let i = 0; i < text.length; i++) {
    const c = text[i];
    if (q) { if (c === '"') { if (text[i + 1] === '"') { cur += '"'; i++; } else q = false; } else cur += c; }
    else if (c === '"') q = true;
    else if (c === ",") { row.push(cur); cur = ""; }
    else if (c === "\n" || c === "\r") { if (c === "\r" && text[i + 1] === "\n") i++; row.push(cur); rows.push(row); row = []; cur = ""; }
    else cur += c;
  }
  if (cur || row.length) { row.push(cur); rows.push(row); }
  return rows.filter((r) => r.some((x) => x.trim()));
}
function fromRows(rows) {
  const warns = [];
  const qs = rows.slice(1).map((r, n) => {
    const cell = (i) => (r[i] ?? "").trim();
    const choice = (i) => isImg(cell(i)) ? { image: cell(i) } : { text: cell(i) };
    if (cell(3) && !isImg(cell(3))) warns.push(`แถว ${n + 2}: รูปโจทย์ต้องขึ้นต้น images/ หรือ rbxassetid://`);
    return { set: cell(0), num: Number(cell(1)), text: cell(2), image: isImg(cell(3)) ? cell(3) : null,
      choices: [4, 5, 6, 7, 8].map(choice), answer: Number(cell(9)) };
  });
  return { qs, warns };
}
function toCsv() {
  const esc = (v) => /[",\n\r]/.test(v ?? "") ? `"${String(v).replace(/"/g, '""')}"` : (v ?? "");
  const lines = [["ชุด", "ข้อ", "โจทย์", "รูปโจทย์", "ตัวเลือก1", "ตัวเลือก2", "ตัวเลือก3", "ตัวเลือก4", "ตัวเลือก5", "ข้อที่ถูก"].join(",")];
  for (const q of data) lines.push([q.set, q.num, q.text, q.image || "", ...q.choices.map((c) => c.image || c.text || ""), q.answer].map(esc).join(","));
  return "﻿" + lines.join("\r\n") + "\r\n";
}
function download(name, text, type) {
  const a = h("a", { href: URL.createObjectURL(new Blob([text], { type })), download: name });
  document.body.append(a); a.click(); a.remove();
}
async function doImport(file) {
  try {
    const text = await file.text();
    let qs, warns = [];
    if (file.name.toLowerCase().endsWith(".json")) { const j = JSON.parse(text); qs = Array.isArray(j) ? j : j.questions; }
    else ({ qs, warns } = fromRows(parseCsv(text)));
    if (!Array.isArray(qs)) throw new Error("ไม่พบรายการโจทย์");
    const good = [];
    qs.forEach((q, n) => { q = clean({ ...q, choices: (q.choices || []).map((c) => ({ text: c.text, image: c.image })) });
      const m = validate(q); if (m) warns.push(`ข้อที่ ${n + 1} (${key(q)}): ${m}`); else good.push(q); });
    if ($("#replaceAll").checked) data = [];
    good.forEach((q) => { const i = data.findIndex((x) => key(x) === key(q)); if (i >= 0) data[i] = q; else data.push(q); });
    editing = null; form = null; markDirty(); renderForm();
    status(`นำเข้า ${good.length} ข้อ` + (warns.length ? ` ข้าม ${warns.length} ข้อ: ${warns.slice(0, 3).join(" | ")}` : "") + " — กด “บันทึกขึ้น GitHub” เพื่อส่งขึ้นรีโป", warns.length ? "warn" : "ok");
  } catch (e) { status("นำเข้าไม่สำเร็จ: " + e.message, "err"); }
}

// ---------- ผูกปุ่ม ----------
$("#bSettings").onclick = () => $("#settings").classList.toggle("hide");
$("#bCfg").onclick = () => {
  cfg = { owner: $("#cOwner").value.trim(), repo: $("#cRepo").value.trim(), token: $("#cToken").value.trim() };
  try { localStorage.setItem("mazeEditorCfg", JSON.stringify(cfg)); } catch {}
  $("#settings").classList.add("hide"); load();
};
$("#bReload").onclick = () => { if (!dirty || confirm("การแก้ที่ยังไม่บันทึกจะหาย โหลดใหม่?")) load(); };
$("#bNew").onclick = add;
$("#bSave").onclick = save;
$("#filter").oninput = renderList;
$("#bImport").onclick = () => $("#fImport").click();
$("#fImport").onchange = (e) => { if (e.target.files[0]) doImport(e.target.files[0]); e.target.value = ""; };
$("#bExpJson").onclick = () => download("questions.json", JSON.stringify({ questions: data }, null, 2), "application/json");
$("#bExpCsv").onclick = () => download("questions.csv", toCsv(), "text/csv");

$("#cOwner").value = cfg.owner; $("#cRepo").value = cfg.repo; $("#cToken").value = cfg.token;
if (cfg.owner && cfg.token) load(); else { $("#settings").classList.remove("hide"); status("ตั้งค่ารีโปและ token ก่อนเริ่มใช้งาน"); renderList(); }
</script>
